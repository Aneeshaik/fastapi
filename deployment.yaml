apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: payments-api
          image: ghcr.io/aneeshaik/fastapi:latest
          ports:
            - containerPort: 8000
          env:
            - name: PAYMENTS_DB_URL
              valueFrom:
                secretKeyRef:
                  name: payments-secrets
                  key: DATABASE_URL